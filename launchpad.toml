esp_toml_version = 1.0

firmware_images_url = "https://sunnyqeen.github.io/esp-usb-bridge/"
supported_apps = ["esp-s3-devkitc", "esp-s3-devkitc-v11"]

[esp-s3-devkitc]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "esp-s3-devkitc.bin"
description = "Firmware for ESP-S3-DevkitC-1 board"

[esp-s3-devkitc-v11]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "esp-s3-devkitc-v11.bin"
description = "Firmware for ESP-S3-DevkitC-1 board v1.1"
